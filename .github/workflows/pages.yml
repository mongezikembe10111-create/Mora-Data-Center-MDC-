name: Publish The Public Square

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-square-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - name: Build the public website
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PUBLIC_SQUARE_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified site artifact
        id: deployment
        uses: actions/deploy-pages@v4
